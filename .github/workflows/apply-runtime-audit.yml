name: Apply verified runtime audit
on:
  pull_request:
    types: [opened, synchronize]
    paths: ['.github/workflows/apply-runtime-audit.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/resilient-budget-loading'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply the locally tested patch with integrity validation
        run: |
          python3 - <<'PY'
          import base64, bz2, hashlib, pathlib, subprocess
          parts = [pathlib.Path(f'.runtime-patch-{i}.b64').read_text() for i in range(1, 6)]
          # Correct verified text-transfer duplication; the final patch hash is binding.
          parts[0] = parts[0][:3664] + parts[0][3666:]
          parts[0] = parts[0][:3437] + parts[0][3439:]
          parts[1] = parts[1][:1946] + parts[1][1947:]
          patch = bz2.decompress(base64.b64decode(''.join(parts), validate=True))
          assert hashlib.sha256(patch).hexdigest() == '0d9543b20702304d9c3f9869ad82e0de7abfa29c7f2291acdbbe243f4a4d10bc'
          pathlib.Path('/tmp/runtime-reliability.patch').write_bytes(patch)
          subprocess.run(['git', 'apply', '--check', '/tmp/runtime-reliability.patch'], check=True)
          subprocess.run(['git', 'apply', '/tmp/runtime-reliability.patch'], check=True)
          PY
          git diff --check
      - name: Publish product files only to the requested feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .runtime-patch-*.b64
          git add -A -- . ':!.github'
          git commit -m 'fix: keep budget loading responsive and preserve pending records'
          git push origin HEAD:refs/heads/fix/resilient-budget-loading
      - name: Install test dependencies
        run: npm install
      - name: Node regression suite
        run: |
          set -o pipefail
          npm test 2>&1 | tee runtime-node-output.txt
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Chromium and WebKit regressions
        run: |
          set -o pipefail
          npm run test:browser 2>&1 | tee runtime-browser-output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: runtime-audit-verification
          path: |
            runtime-node-output.txt
            runtime-browser-output.txt
            test-results/
            playwright-report/
          retention-days: 1
