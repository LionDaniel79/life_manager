name: Runtime audit snapshot
on: pull_request
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive tracked source only
        run: git archive --format=tar HEAD -o audit-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-audit-source
          path: audit-source.tar
          retention-days: 1
